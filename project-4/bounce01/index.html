
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Photo Switcher</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="profile-card">
        <h1>Choose My Profile Photo</h1>

        <img id="profile-image"
             src="assets/casual.jpg"
             alt="Casual profile photo">

        <p id="photo-description">Casual Style</p>

        <button id="switch-button" type="button">
            Switch Photo
        </button>
    </main>
</body>
</html>
